<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Facilitator Hub</title>
<style>
/* ---- tokens: Navy is the default scheme (spec v2.0 §6) ---- */
:root{
  --bg:#EDF1F7; --panel:#F9FBFD; --ink:#0E1E3F; --headerBg:#0E1E3F; --headerFg:#EDF1F7;
  --muted:#5B6B8C; --line:#D7DEEA; --zebra:#F3F6FA; --accent:#2C5BA8; --onAccent:#FFFFFF;
  --accentText:#2C5BA8; --body:#324066; --field:#FFFFFF; --tested:#D7E1F0; --testedFg:#0E1E3F;
  --pass:#1E6B47; --passT:#E3F0E7; --fail:#B23A2E; --failT:#F9E5E2;
  --pend:#9A6B12; --pendT:#F5EEDD; --block:#0E1E3F; --blockT:#E3E7F0;
  --na:#8A93AC; --naT:#EEF1F7;
}
[data-scheme="canon"]{
  --bg:#F6ECD6; --panel:#FFFAEE; --ink:#101D3D; --headerBg:#101D3D; --headerFg:#F6ECD6;
  --muted:#7A6E55; --line:#E3D2A8; --zebra:#FBF4E3; --accent:#C9A961; --onAccent:#101D3D;
  --accentText:#A8843C; --body:#4A4535; --field:#FFFDF7; --tested:#E7D9B4; --testedFg:#101D3D;
  --pass:#1E7A45; --passT:#E4F2E9; --fail:#B3261E; --failT:#FBE6E4;
  --pend:#A97605; --pendT:#F8EED6; --block:#141414; --blockT:#E8E4DA;
  --na:#9A8F75; --naT:#F1EADA;
}
[data-scheme="slate"]{
  --bg:#EEF0F1; --panel:#FBFCFC; --ink:#1B2227; --headerBg:#1B2227; --headerFg:#EEF0F1;
  --muted:#6F787D; --line:#DBE0E2; --zebra:#F4F6F6; --accent:#2F7D74; --onAccent:#FFFFFF;
  --accentText:#2F7D74; --body:#3C464C; --field:#FFFFFF; --tested:#D6E7E4; --testedFg:#1B2227;
  --pass:#1F6B45; --passT:#E1EFE7; --fail:#B4482F; --failT:#F9E7E2;
  --pend:#9A6B12; --pendT:#F6EEDD; --block:#1B2227; --blockT:#E4E7E9;
  --na:#8D969B; --naT:#EEF1F2;
}
[data-scheme="dark"]{
  --bg:#14171B; --panel:#1C2127; --ink:#E7E4DC; --headerBg:#242B33; --headerFg:#E7E4DC;
  --muted:#8B939B; --line:#2C333B; --zebra:#20262D; --accent:#E0A93A; --onAccent:#14171B;
  --accentText:#E0A93A; --body:#C3C8CD; --field:#161A1F; --tested:#3A424B; --testedFg:#E7E4DC;
  --pass:#4CC38A; --passT:#17301F; --fail:#F2665B; --failT:#331A19;
  --pend:#E0A93A; --pendT:#332714; --block:#C3C8CD; --blockT:#2A2F35;
  --na:#6B7178; --naT:#22272D;
}
[data-scheme="mono"]{
  --bg:#F2F2F0; --panel:#FFFFFF; --ink:#111111; --headerBg:#111111; --headerFg:#FFFFFF;
  --muted:#6E6E6E; --line:#DADADA; --zebra:#F7F7F5; --accent:#111111; --onAccent:#FFFFFF;
  --accentText:#4A4A4A; --body:#333333; --field:#FFFFFF; --tested:#DDDDDD; --testedFg:#111111;
  --pass:#111111; --passT:#E6E6E4; --fail:#111111; --failT:#CFCFCD;
  --pend:#6E6E6E; --pendT:#EDEDEB; --block:#111111; --blockT:#C2C2C0;
  --na:#9A9A98; --naT:#F4F4F2;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:Helvetica Neue,Helvetica,Arial,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:32px 24px 64px}
a{color:var(--ink)} a:hover{color:var(--accentText)}
button,textarea,select,input{font-family:inherit}
@media print{.noprint{display:none!important}}

/* ---- header ---- */
.head{padding-bottom:14px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:3px solid var(--ink)}
.eyebrow{font:600 10px/1 IBM Plex Mono,monospace;letter-spacing:.18em;color:var(--accentText)}
.title{font:700 27px/1.15 Libre Baskerville,Georgia,serif;letter-spacing:-.01em}
.headmeta{font:400 10px/1.5 IBM Plex Mono,monospace;text-align:right;color:var(--muted)}

/* ---- metric strip ---- */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:18px}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 12px 11px;display:flex;flex-direction:column;gap:4px}
.metric .num{font:700 26px/1 Libre Baskerville,Georgia,serif}
.metric .lbl{font:500 10px/1.3 IBM Plex Mono,monospace;letter-spacing:.1em;color:var(--muted)}

/* ---- how-this-works ---- */
.keypanel{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:4px;padding:16px 18px}
.keyintro{font:400 13px/1.5 Helvetica Neue,Helvetica,Arial,sans-serif;color:var(--body);margin-bottom:14px}
.keygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px 18px}
.keyitem{display:flex;align-items:flex-start;gap:10px}
.circ{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 14px/1 IBM Plex Mono,monospace;border:2px solid var(--ink);background:var(--panel);color:var(--ink)}
.circ.explain{border-color:var(--accent)}
.circ.proceed{background:var(--ink);color:var(--bg)}
.circ.improve,.circ.data{background:var(--accent);color:var(--onAccent)}
.keyname{font:700 12px/1.2 IBM Plex Mono,monospace;letter-spacing:.02em}
.keydesc{font:400 12px/1.45 Helvetica Neue,Helvetica,Arial,sans-serif;color:var(--muted);text-wrap:pretty}

/* ---- sticky bar ---- */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);margin-top:18px;padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.btn{border-radius:3px;height:44px;padding:0 20px;font:700 12px/1 IBM Plex Mono,monospace;letter-spacing:.08em;cursor:pointer;background:var(--ink);color:var(--bg);border:2px solid var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);font-weight:600;padding:0 16px}
.btn.ghost.on{background:var(--ink);color:var(--bg)}
.btn.ghost.accent-on{background:var(--accent);color:var(--onAccent)}
.schemewrap{display:flex;align-items:center;gap:6px;margin-left:auto}
.schemelbl{font:500 10px/1 IBM Plex Mono,monospace;letter-spacing:.1em;color:var(--muted)}
.sbtn{display:flex;align-items:center;gap:5px;height:32px;padding:0 9px;border-radius:3px;cursor:pointer;font:600 10px/1 IBM Plex Mono,monospace;letter-spacing:.06em;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.sbtn.on{background:var(--ink);color:var(--bg)}
.dots{display:flex}
.dots i{width:9px;height:9px;border-radius:50%;display:block}
.dots i+i{margin-left:-3px}
.statuswrap{display:flex;flex-direction:column;gap:3px;align-items:flex-end;font-family:IBM Plex Mono,monospace}
.statuswrap div{font:400 10px/1.3 IBM Plex Mono,monospace;color:var(--muted)}
#promptbox{width:100%;margin-top:10px;border:none;border-radius:4px;padding:14px;font:400 12px/1.6 IBM Plex Mono,monospace;min-height:120px;resize:vertical;background:var(--ink);color:var(--bg)}

/* ---- section heading ---- */
.sechead{display:flex;align-items:baseline;gap:12px;margin:30px 0 10px}
.sechead h2{font:700 15px/1.2 Libre Baskerville,Georgia,serif}
.rule{flex:1;height:1px;background:var(--line)}
.secmeta{font:400 10px/1 IBM Plex Mono,monospace;letter-spacing:.1em;color:var(--accentText)}

/* ---- panels & rows ---- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.scroller{background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow-x:auto}
.inner{min-width:848px}
.row{border-top:1px solid var(--line)}
.cells{display:grid;gap:12px;align-items:start;padding:12px 14px;overflow-wrap:anywhere}
.cells>*{min-width:0}
.hdr{overflow-wrap:anywhere}
.hdr>*{min-width:0}
.hdr{display:grid;gap:8px;align-items:center;padding:9px 14px;background:var(--headerBg);color:var(--headerFg);font:600 12px/1.2 IBM Plex Mono,monospace;letter-spacing:.02em}
.gmod{grid-template-columns:104px 92px 351px minmax(140px,1fr) 104px;gap:8px}
.gqueue{grid-template-columns:62px minmax(140px,220px) 1fr 116px}
.gissue{grid-template-columns:52px 84px 1fr 116px}
.gbudget{grid-template-columns:52px 1fr 96px 96px 92px 116px}
.gmile{grid-template-columns:92px 22px 1fr 84px 116px}
.gnext{grid-template-columns:34px 1fr 104px 116px}
.gfeedback{grid-template-columns:52px 1fr 108px 92px 96px 116px}
.gproj{grid-template-columns:52px 1fr 128px 76px 76px 1fr}
.gpeople{grid-template-columns:1fr 96px 76px 1fr}
.zebra{background:var(--zebra)}
.name{font:600 12px/1.4 IBM Plex Mono,monospace}
.ver{font:400 12px/1.35 IBM Plex Mono,monospace;color:var(--muted)}
.rowtitle{font:600 12px/1.4 Helvetica Neue,Helvetica,Arial,sans-serif}
.note{font:400 12px/1.45 Helvetica Neue,Helvetica,Arial,sans-serif;color:var(--body);text-wrap:pretty}
.ref{font:600 12px/1.4 IBM Plex Mono,monospace;color:var(--accentText)}
.money{font:500 12px/1.4 IBM Plex Mono,monospace;text-align:right}
.meta{font:500 12px/1.4 IBM Plex Mono,monospace;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:4px}

/* ---- status marks: glyph + word + tint ---- */
.chk{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;align-items:center}
.mk{display:flex;align-items:center;justify-content:center;gap:3px;min-height:24px;white-space:nowrap;border-radius:3px;font:600 12px/1 IBM Plex Mono,monospace;letter-spacing:.02em}
.mk i{font-style:normal;font-size:13px}
.mk.pad{padding:0 9px;gap:4px}
.mk-pass{background:var(--passT);color:var(--pass)}
.mk-fail{background:var(--failT);color:var(--fail)}
.mk-pending{background:var(--pendT);color:var(--pend)}
.mk-blocked{background:var(--blockT);color:var(--block)}
.mk-na{background:var(--naT);color:var(--na)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.badge{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:2px;font:600 12px/1 IBM Plex Mono,monospace;letter-spacing:.02em;border:1px solid var(--ink)}
.b-integrated{background:var(--headerBg);color:var(--headerFg)}
.b-tested{background:var(--tested);color:var(--testedFg);border-color:var(--tested)}
.b-building,.b-proposed{background:transparent;color:var(--ink)}
.b-prototype,.b-pending{background:transparent;color:var(--muted);border-color:var(--line)}

/* ---- action trio ---- */
.acts{display:flex;gap:6px;justify-content:flex-end}
.abtn{width:30px;height:30px;border-radius:50%;cursor:pointer;font:600 13px/1 IBM Plex Mono,monospace;border:2px solid var(--ink);background:transparent;color:var(--ink)}
.abtn.plus{font-size:15px}
.abtn.sel{background:var(--ink);color:var(--bg)}
.detail{display:none;grid-column:1/-1;padding:2px 0 2px}
.detail textarea{width:100%;border-radius:3px;padding:9px;font:400 12px/1.5 Helvetica Neue,Helvetica,Arial,sans-serif;min-height:52px;resize:vertical;background:var(--field);border:1.5px solid var(--accent);color:var(--ink)}

.nonerow{padding:10px 2px;font-weight:400;font-size:12px;line-height:1.45;
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:var(--muted)}
.srcbanner{grid-column:1/-1;margin:0 0 14px;padding:10px 14px;border-radius:4px;
  border:2px solid var(--fail);background:var(--failTint);color:var(--fail);
  font-weight:600;font-size:12px;line-height:1.45;font-family:'IBM Plex Mono',monospace}
.stale{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:2px;
  border:1px solid var(--pending);color:var(--pending);background:var(--pendingTint);
  font-weight:600;font-size:10px;font-family:'IBM Plex Mono',monospace}
/* ---- budget & milestones ---- */
.barTrack{height:5px;border-radius:3px}
.barFill{height:100%;border-radius:3px}
.total{display:grid;gap:12px;align-items:center;padding:11px 14px;border-top:2px solid var(--ink)}
.rail{display:flex;flex-direction:column;align-items:center;align-self:stretch}
.dot{width:11px;height:11px;border-radius:50%;margin-top:4px}
.conn{flex:1;width:2px;margin-top:4px;background:var(--line)}
.ctrl{font:600 12px/1.45 IBM Plex Mono,monospace;letter-spacing:.02em;color:var(--accentText)}
.ctrltext{font:400 12px/1.45 Helvetica Neue,Helvetica,Arial,sans-serif;color:var(--muted);text-wrap:pretty}
.logrow{display:grid;grid-template-columns:186px 1fr;gap:14px;padding:10px 14px;border-left:2px solid var(--accent);background:var(--zebra)}
.logwhen{font:500 12px/1.45 IBM Plex Mono,monospace;color:var(--muted)}
.foot{margin-top:28px;font:400 10px/1.5 IBM Plex Mono,monospace;text-align:center;color:var(--muted)}

.gidx{grid-template-columns:160px 1fr 36px 36px 36px 82px 52px}
.ghub{grid-template-columns:82px 42px 1fr 60px 136px}
.ghubR{grid-template-columns:82px 42px 54px 1fr 60px 136px}
.ggen{grid-template-columns:1fr 136px}
.triple{font:400 12px/1.5 Helvetica Neue,Helvetica,Arial,sans-serif;color:var(--body)}
.trio2{display:flex;gap:5px;justify-content:flex-end}
.trio2 button{flex:none;width:26px;height:26px;border-radius:50%;font:600 12px/1 "IBM Plex Mono",monospace;border:2px solid var(--ink);background:transparent;color:var(--ink)}
.trio2 button.on{background:var(--ink);color:var(--bg)}
.trio2 button.imp{background:var(--accent);color:var(--ink)}
.trio2 button.ghost{flex:none;width:26px;height:26px;border-radius:50%;font:600 11px/1 "IBM Plex Mono",monospace;border:1.5px solid var(--line);background:transparent;color:var(--muted)}
.idxrow{cursor:pointer}
.pill{display:flex;align-items:center;justify-content:center;height:24px;border-radius:3px;font:600 12px/1 "IBM Plex Mono",monospace}
.pill0{background:var(--naT);color:var(--na)}
.pillhot{background:var(--failT);color:var(--fail)}
.pillwarm{background:var(--pendT);color:var(--pend)}
.pillundef{background:var(--line);color:var(--muted)}
.line-clamp{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.line-open{display:block}
.triple b{font:600 10px/1.5 "IBM Plex Mono",monospace;letter-spacing:.06em;color:var(--accentText)}
</style></head><body><div class="wrap" id="app"></div>
<script>

ainst the web app v2.3 API contract.","problem":"Mobile module marks are evidenced against the older v2.1 contract, so some may be silently stale.","needed":"Re-baseline the mobile modules against the current API contract.","owner":"Claude"},{"tracker":"docs","ref":"I7","rating":"Low","issue":"The public docs still describe the pre-v2 settings screen.","problem":"New users following the docs hit a UI that no longer matches.","needed":"Refresh the settings section of the docs against v2.3.","owner":"Alex"}],"hubActions":[{"tracker":"portfolio","ref":"B1-B4","issue":"Budget lines B1–B4 are still forecast figures, not committed spend.","problem":"Every budget total and variance shown is provisional until real numbers replace the forecasts.","needed":"Alex to confirm real budget figures for B1–B4.","owner":"Alex"},{"tracker":"web","ref":"P2","issue":"The remaining polish items (empty states, error toasts, keyboard shortcuts) are queued behind the release-blocking set.","problem":"Nothing formally triggers moving them into active work once the blockers clear.","needed":"Once the release blockers pass, pull the polish set into active work.","owner":"Alex + Claude"}],"hubGeneral":[{"tracker":"web","note":""},{"tracker":"mobile","note":""},{"tracker":"docs","note":""},{"tracker":"portfolio","note":""},{"tracker":"ops","note":""}],"incomplete":[],"log":[["2026-07-29","Pooled the web, mobile and docs trackers read fresh from canon. 1 decision, 4 issues, 2 actions surfaced; 0 rows held to incomplete. Deduplicated same-fact rows across trackers down to one each, citing the fuller source."],["2026-07-28","Refresh pass: re-read all source trackers. No rows added, removed or re-tagged this pass."]]};
let DATA = EMBEDDED;
let state = {
  scheme:'navy', filterTracker:'ALL', filterOwner:'ALL', query:'',
  choices:{}, details:{}, expanded:{}, allOpen:false, general:{}, prompt:'', dataRefresh:false,
  sort:{index:{key:'id',dir:1}, decisions:{key:'tracker',dir:1}, issues:{key:'rating',dir:1}, actions:{key:'tracker',dir:1}},
  live:false, loadError:null
};
const GLYPH={pass:'\u2713',fail:'\u2715',pending:'~',blocked:'\u25a0',na:'\u2013'};
const RATING_RANK={High:0,Med:1,Low:2};
const SCHEMES=[['navy','NAVY','#0E1E3F','#2C5BA8','#EDF1F7'],['canon','CANON','#101D3D','#C9A961','#F6ECD6'],['slate','SLATE','#1B2227','#2F7D74','#EEF0F1'],
               ['dark','DARK','#242B33','#E0A93A','#14171B'],['mono','MONO','#111111','#111111','#F2F2F0']];
function setScheme(k){ state.scheme=k;
  if(k==='navy'){ delete document.documentElement.dataset.scheme; } else { document.documentElement.dataset.scheme=k; }
  render(); }
function esc(s){ s=String(s==null?'':s); const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function tname(k){ const t=DATA.trackers.find(t=>t.k===k); return t?t.name:k; }
function tid(k){ const t=DATA.trackers.find(t=>t.k===k); return t?t.id:k; }

async function loadData(){
  if(TRACKER_SOURCE){
    try{ const r=await fetch(TRACKER_SOURCE,{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status);
      DATA=await r.json(); state.live=true; state.loadError=null; }
    catch(e){ DATA=EMBEDDED; state.live=false; state.loadError=String(e.message||e); }
  } else { DATA=EMBEDDED; state.live=false; state.loadError='no TRACKER_SOURCE configured'; }
  render();
}

function matches(r){
  if(state.filterTracker!=='ALL' && r.tracker!==state.filterTracker) return false;
  if(state.filterOwner!=='ALL' && (r.owner||'Unassigned')!==state.filterOwner) return false;
  const q=state.query.trim().toLowerCase(); if(!q) return true;
  return [r.ref,r.short,r.issue,r.problem,r.needed,r.owner,tname(r.tracker)].filter(Boolean).join(' ').toLowerCase().includes(q);
}
function sortRows(rows,sec){
  const {key,dir}=state.sort[sec];
  const val=r=>{ if(key==='tracker') return tname(r.tracker); if(key==='rating') return RATING_RANK[r.rating]??9; return r[key]??''; };
  return rows.slice().sort((a,b)=>{ const x=val(a),y=val(b); return x<y?-dir:x>y?dir:0; });
}
function toggleSort(sec,key){ const s=state.sort[sec]; state.sort={...state.sort,[sec]:{key,dir:s.key===key?-s.dir:1}}; render(); }
function markRow(sec,ref,choice){ const k=sec+':'+ref; if(state.choices[k]===choice) delete state.choices[k]; else state.choices[k]=choice; state.prompt=''; render(); }
function setDetail(sec,ref,v){ state.details[sec+':'+ref]=v; }
function toggleExpand(sec,ref){ const k=sec+':'+ref; state.expanded[k]=!state.expanded[k]; render(); }

function triple(sec,r){
  /* spec 3.7: a row without all three fields stays a flat note rather than a padded triple.
     JSON field stays `needed`; only the rendered label is ASK (spec v3.6). */
  if(r.issue===undefined&&r.problem===undefined&&r.needed===undefined)
    return `<div class="note">${esc(r.note||r.short||'')}</div>`;

  const cls=open?'line-open':'line-clamp';
  return `<div class="triple" style="display:flex;flex-direction:column;gap:5px">
    <div class="${cls}"><b>ISSUE </b>${esc(r.issue)}</div>
    <div class="${cls}"><b>PROBLEM </b>${esc(r.problem)}</div>
    <div class="${cls}"><b>ASK </b>${esc(r.needed)}</div>
  </div>`;
}
function trio(sec,r){
  const k=sec+':'+r.ref; const c=state.choices[k]; const open=state.allOpen||!!state.expanded[k];
  return `<div class="trio2">
    <button class="${c==='explain'?'on':''}" title="EXPLAIN" onclick="markRow('${sec}','${r.ref}','explain')">!</button>
    <button class="${c==='proceed'?'on':''}" title="PROCEED" onclick="markRow('${sec}','${r.ref}','proceed')">\u2713</button>
    <button class="${c==='improve'?'imp':''}" title="IMPROVE" onclick="markRow('${sec}','${r.ref}','improve')">+</button>
    <button class="ghost" title="Expand" onclick="toggleExpand('${sec}','${r.ref}')">${open?'\u2013':'\u2026'}</button>
  </div>`;
}
function rowBar(sec,ref){ const c=state.choices[sec+':'+ref]; return c?'box-shadow:inset 4px 0 0 var(--accent);':''; }

function renderIndex(){
  const rows = DATA.trackers
    .filter(t=>state.filterOwner==='ALL'||t.owner===state.filterOwner)
    .map(t=>{
      const dec=DATA.hubDecisions.filter(r=>r.tracker===t.k).length;
      const iss=DATA.hubIssues.filter(r=>r.tracker===t.k).length;
      const act=DATA.hubActions.filter(r=>r.tracker===t.k).length;
      return {...t, dec, iss, act};
    });
  const {key,dir}=state.sort.index;
  rows.sort((a,b)=>{ const x=a[key]??a.id, y=b[key]??b.id; return x<y?-dir:x>y?dir:0; });
  const pill=(n,hot)=>`<div class="pill ${n===0?'pill0':hot?'pillhot':'pillwarm'}">${n}</div>`;
  document.getElementById('idxBody').innerHTML = rows.length ? rows.map((r,i)=>`
    <div style="border-top:1px solid var(--line);${i%2?'background:var(--zebra);':''}${state.filterTracker===r.k?'box-shadow:inset 4px 0 0 var(--ink);':''}">
     <div class="cells gidx idxrow" style="align-items:center" onclick="state.filterTracker=state.filterTracker==='${r.k}'?'ALL':'${r.k}'; render();">
      <div style="font:600 11px/1.4 IBM Plex Mono,monospace;color:var(--accentText)">${esc(r.id)}</div>
      <div style="font:600 12px/1.4 Helvetica Neue,Helvetica,Arial,sans-serif">${esc(r.name)}</div>
      ${pill(r.dec,false)}${pill(r.iss,r.iss>2)}${pill(r.act,false)}
      <div style="font:400 11px/1.4 IBM Plex Mono,monospace;color:var(--muted)">${esc(r.updated)}</div>
      <div style="font:500 11px/1.4 IBM Plex Mono,monospace;color:var(--muted)">${esc(r.owner)}</div>
     </div></div>`).join('') : '<div class="nonerow">\u2014 none \u2014</div>';
}

function renderSection(id,sec,rows,cols,extraCol){
  const filtered = sortRows(rows.filter(matches), sec);
  document.getElementById(id).innerHTML = filtered.length ? filtered.map((r,i)=>{
    const c=state.choices[sec+':'+r.ref];
    return `
    <div style="border-top:1px solid var(--line);${i%2?'background:var(--zebra);':''}${rowBar(sec,r.ref)}">
     <div class="cells ${cols}" style="align-items:start">
      <div style="font:500 11px/1.4 IBM Plex Mono,monospace;color:var(--muted)">${esc(tname(r.tracker))}</div>
      <div style="font:600 12px/1.4 IBM Plex Mono,monospace;color:var(--accentText)">${esc(r.ref)}</div>
      ${extraCol?extraCol(r):''}
      ${triple(sec,r)}
      <div style="font:500 11px/1.4 IBM Plex Mono,monospace;color:var(--muted)">${esc(r.owner||'Unassigned')}</div>
      ${trio(sec,r)}
     </div>
     ${c==='improve' ? `<div style="padding:0 14px 12px"><textarea style="width:100%;border-radius:3px;padding:9px;font:400 12px/1.5 Helvetica Neue,Helvetica,Arial,sans-serif;min-height:60px;resize:vertical;background:var(--field);border:1.5px solid var(--accent);color:var(--ink)" placeholder="what to change\u2026" oninput="setDetail('${sec}','${r.ref}',this.value)">${esc(state.details[sec+':'+r.ref]||'')}</textarea></div>` : ''}
     </div>`;
  }).join('') : '<div class="nonerow">\u2014 none \u2014</div>';
}

function renderGeneral(){
  const rows = DATA.hubGeneral.filter(g=>state.filterTracker==='ALL'||g.tracker===state.filterTracker);
  document.getElementById('genBody').innerHTML = rows.length ? rows.map((g,i)=>{
    const c=state.choices['general:'+g.tracker];
    return `<div style="border-top:1px solid var(--line);${i%2?'background:var(--zebra);':''}${c?'box-shadow:inset 4px 0 0 var(--accent);':''}">
     <div class="cells ggen" style="align-items:center">
      <div style="font:600 11px/1.4 IBM Plex Mono,monospace">${esc(tname(g.tracker))}</div>
      <div class="trio2">
        <button class="${c==='explain'?'on':''}" title="EXPLAIN" onclick="markRow('general','${g.tracker}','explain')">!</button>
        <button class="${c==='proceed'?'on':''}" title="PROCEED" onclick="markRow('general','${g.tracker}','proceed')">\u2713</button>
        <button class="${c==='improve'?'imp':''}" title="IMPROVE" onclick="markRow('general','${g.tracker}','improve')">+</button>
      </div>
     </div>
     ${c==='improve' ? `<div style="padding:0 14px 12px"><textarea style="width:100%;border-radius:3px;padding:9px;font:400 12px/1.5 Helvetica Neue,Helvetica,Arial,sans-serif;min-height:60px;resize:vertical;background:var(--field);border:1.5px solid var(--accent);color:var(--ink)" placeholder="general update for ${esc(tname(g.tracker))}\u2026" oninput="DATA.hubGeneral.find(x=>x.tracker==='${g.tracker}').note=this.value">${esc(g.note||'')}</textarea></div>` : ''}
     </div>`;}).join('') : '<div class="nonerow">\u2014 none \u2014</div>';
}

function buildPrompt(){
  const L=[];
  if(state.dataRefresh) L.push('- REFRESH DATA: re-read every source tracker fresh from canon, re-derive every open decision/issue/next-action, refresh and regenerate each source tracker\'s own dashboard (not just this pooled view), then re-pool this hub with a new data stamp.');
  const block=(label,rows,sec)=>{ rows.forEach(r=>{ const c=state.choices[sec+':'+r.ref]; if(!c) return;
    const extra=(state.details[sec+':'+r.ref]||'').trim();
    L.push('- ['+c.toUpperCase()+'] '+label+' '+r.ref+' ('+tname(r.tracker)+', owner '+(r.owner||'Unassigned')+')'
      +(extra?'\n    Extra direction: '+extra:'')); }); };
  block('DECISION',DATA.hubDecisions,'decisions'); block('ISSUE',DATA.hubIssues,'issues'); block('NEXT ACTION',DATA.hubActions,'actions');
  const gen=[];
  DATA.hubGeneral.forEach(g=>{ const c=state.choices['general:'+g.tracker]; const note=(g.note||'').trim();
    if(!note && !c) return;
    gen.push('- '+(c?'['+c.toUpperCase()+'] ':'')+tname(g.tracker)+(note?'\n    '+note:'')); });
  const head='Facilitator Hub review \u2014 '+(DATA.meta.generatedAt||'')+(state.filterTracker!=='ALL'?' \u2014 scoped to '+tname(state.filterTracker):'')+':';
  if(!L.length && !gen.length) return head+'\nNothing marked.';
  return head+(L.length?'\nMARKED ITEMS\n'+L.join('\n'):'')+(gen.length?'\n\nGENERAL UPDATE\n'+gen.join('\n'):'');
}
function forceRefresh(){ state.dataRefresh=true; render(); }
function createPrompt(){ state.prompt=buildPrompt(); render();
  const b=document.getElementById('promptbox'); if(navigator.clipboard) navigator.clipboard.writeText(state.prompt).catch(()=>{}); }
function resetAll(){ state={...state, choices:{}, details:{}, expanded:{}, allOpen:false, prompt:'', filterTracker:'ALL', filterOwner:'ALL', query:'', scheme:'navy', dataRefresh:false}; delete document.documentElement.dataset.scheme; render(); }

function render(){
  const owners = Array.from(new Set([].concat(DATA.hubDecisions,DATA.hubIssues,DATA.hubActions).map(r=>r.owner||'Unassigned'))).sort();
  document.getElementById('app').innerHTML = `
   <div style="max-width:1440px;margin:0 auto;padding:30px 24px 80px">
    <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:3px solid var(--ink)">
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="font:600 10px/1 IBM Plex Mono,monospace;letter-spacing:.18em;color:var(--accentText)">${esc(DATA.meta.eyebrow||'PROGRAMME REVIEW SURFACE')}</div>
        <div style="font:700 27px/1.15 Libre Baskerville,Georgia,serif">${esc(DATA.meta.title||'Facilitator Hub')}</div>
      </div>
      <div style="font:400 10px/1.6 IBM Plex Mono,monospace;text-align:right;color:var(--muted)">
        rollup across ${DATA.trackers.length} trackers<br>${state.live?'live':'SNAPSHOT'} \u00b7 generated ${esc(DATA.meta.generatedAt)} \u00b7 maintained by ${esc(DATA.meta.maintainer)}
      </div>
    </div>
    <div class="keypanel">
      <div class="keyintro">Run the meeting top to bottom. Claude cannot see edits made here \u2014 mark rows with the action buttons below, then press <b>CREATE PROMPT</b> and paste the result into chat. Nothing here writes back to canon; the prompt is the hand-off.</div>
      <div class="keygrid">${[
        ['!','explain','EXPLAIN','Ask Claude to walk through this item in more detail before deciding.'],
        ['\u2713','proceed','PROCEED','Implement this item as written.'],
        ['+','improve','IMPROVE','Add your own extra direction \u2014 a text field opens below the row.'],
        ['\u2026','','EXPAND','Show the full ISSUE \u00b7 PROBLEM \u00b7 ASK text instead of the one-line clamp.']
      ].map(([g,c,n,d])=>`<div class="keyitem"><div class="circ ${c}">${g}</div><div class="stack"><div class="keyname">${n}</div><div class="keydesc">${d}</div></div></div>`).join('')}</div>
    </div>
    <div class="noprint" style="position:sticky;top:0;z-index:20;margin-top:16px;padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bg);border-bottom:1px solid var(--line)">
      <button style="height:40px;padding:0 18px;border-radius:3px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);font:700 12px/1 IBM Plex Mono,monospace" onclick="createPrompt()">CREATE PROMPT</button>
      <button style="height:40px;padding:0 14px;border-radius:3px;border:2px solid var(--ink);background:transparent;color:var(--ink);font:600 12px/1 IBM Plex Mono,monospace" onclick="resetAll()">RESET</button>
      <button id="f-data" style="height:40px;padding:0 14px;border-radius:3px;border:1.5px solid var(--ink);font:600 12px/1 IBM Plex Mono,monospace;${state.dataRefresh?'background:var(--ink);color:var(--bg)':'background:transparent;color:var(--ink)'}" onclick="forceRefresh()">↻ REFRESH DATA${state.dataRefresh?' ✓':''}</button>
      <select style="height:40px;padding:0 10px;border-radius:3px;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink)" onchange="state.filterTracker=this.value; render()">
        <option value="ALL">ALL TRACKERS</option>
        ${DATA.trackers.map(t=>`<option value="${t.k}" ${state.filterTracker===t.k?'selected':''}>${esc(t.name)}</option>`).join('')}
      </select>
      <select style="height:40px;padding:0 10px;border-radius:3px;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink)" onchange="state.filterOwner=this.value; render()">
        <option value="ALL">ALL OWNERS</option>
        ${owners.map(o=>`<option value="${o}" ${state.filterOwner===o?'selected':''}>${esc(o)}</option>`).join('')}
      </select>
      <input style="height:40px;width:190px;padding:0 10px;border-radius:3px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink)" placeholder="search\u2026" value="${esc(state.query)}" oninput="state.query=this.value; render()">
      <button style="height:40px;padding:0 14px;border-radius:3px;border:1.5px solid var(--line);background:transparent;color:var(--muted);font:600 11px/1 IBM Plex Mono,monospace" onclick="state.allOpen=!state.allOpen; render()">${state.allOpen?'COLLAPSE ALL':'EXPAND ALL'}</button>
      <div class="schemewrap">
        <div class="schemelbl">SCHEME</div>
        <div style="display:flex;gap:6px">${SCHEMES.map(([k,l,a,b,c])=>`<button class="sbtn${state.scheme===k?' on':''}" title="${l}" onclick="setScheme('${k}')"><span class="dots"><i style="background:${a}"></i><i style="background:${b}"></i><i style="background:${c}"></i></span>${l}</button>`).join('')}</div>
      </div>
    </div>
    ${state.prompt? `<textarea id="promptbox" class="noprint" readonly style="width:100%;margin-top:10px;border:none;border-radius:4px;padding:14px;font:400 12px/1.6 IBM Plex Mono,monospace;min-height:150px;background:var(--ink);color:var(--bg)">${esc(state.prompt)}</textarea>` : ''}

    <div style="display:flex;align-items:baseline;gap:12px;margin:30px 0 10px"><div style="font:700 15px/1.2 Libre Baskerville,Georgia,serif">Dashboard Index</div><div style="flex:1;height:1px;background:var(--line)"></div></div>
    <div style="background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow-x:auto"><div style="min-width:565px">
      <div class="hdr gidx"><div>TRACKER NAME</div><div>SIMPLE NAME</div><div style="text-align:center">DEC</div><div style="text-align:center">ISS</div><div style="text-align:center">NEXT</div><div>UPDATED</div><div>OWNER</div></div>
      <div id="idxBody"></div>
    </div></div>

    <div style="display:flex;align-items:baseline;gap:12px;margin:30px 0 10px"><div style="font:700 15px/1.2 Libre Baskerville,Georgia,serif">Decisions Pending</div><div style="flex:1;height:1px;background:var(--line)"></div></div>
    <div style="background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow-x:auto"><div style="min-width:460px">
      <div class="hdr ghub"><div>TRACKER</div><div>REF</div><div>ISSUE \u00b7 PROBLEM \u00b7 ASK</div><div>OWNER</div><div style="text-align:right">ACTIONS</div></div>
      <div id="decBody"></div>
    </div></div>

    <div style="display:flex;align-items:baseline;gap:12px;margin:30px 0 10px"><div style="font:700 15px/1.2 Libre Baskerville,Georgia,serif">Open Issues</div><div style="flex:1;height:1px;background:var(--line)"></div></div>
    <div style="background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow-x:auto"><div style="min-width:500px">
      <div class="hdr ghubR"><div>TRACKER</div><div>REF</div><div>RATING</div><div>ISSUE \u00b7 PROBLEM \u00b7 ASK</div><div>OWNER</div><div style="text-align:right">ACTIONS</div></div>
      <div id="issBody"></div>
    </div></div>

    <div style="display:flex;align-items:baseline;gap:12px;margin:30px 0 10px"><div style="font:700 15px/1.2 Libre Baskerville,Georgia,serif">Next Actions</div><div style="flex:1;height:1px;background:var(--line)"></div></div>
    <div style="background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow-x:auto"><div style="min-width:460px">
      <div class="hdr ghub"><div>TRACKER</div><div>REF</div><div>ISSUE \u00b7 PROBLEM \u00b7 ASK</div><div>OWNER</div><div style="text-align:right">ACTIONS</div></div>
      <div id="actBody"></div>
    </div></div>

    <div style="display:flex;align-items:baseline;gap:12px;margin:30px 0 10px"><div style="font:700 15px/1.2 Libre Baskerville,Georgia,serif">General Update</div><div style="flex:1;height:1px;background:var(--line)"></div></div>
    <div style="background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow-x:auto"><div style="min-width:480px">
      <div class="hdr ggen"><div>TRACKER</div><div style="text-align:right">ACTIONS</div></div>
      <div id="genBody"></div>
    </div></div>

    <div style="margin-top:28px;font:400 10px/1.5 IBM Plex Mono,monospace;text-align:center;color:var(--muted)">A view over the tracker suite \u2014 swap the data, not the layout</div>
   </div>`;
  renderIndex();
  renderSection('decBody','decisions',DATA.hubDecisions,'ghub');
  renderSection('issBody','issues',DATA.hubIssues,'ghubR', r=>{
    const known=r.rating==='High'||r.rating==='Med'||r.rating==='Low';
    const rateChip=`<div class="pill ${r.rating==='High'?'pillhot':r.rating==='Med'?'pillwarm':known?'pill0':'pillundef'}">${known?esc(r.rating):'UNDEF'}</div>`;
    const partialChip=r.resolution==='partial'?`<div class="pill pillwarm" style="margin-bottom:3px">PARTIAL</div>`:'';
    return `<div class="stack" style="gap:3px">${partialChip}${rateChip}</div>`;
  });
  renderSection('actBody','actions',DATA.hubActions,'ghub');
  renderGeneral();
}
loadData();
</script></body></html>
